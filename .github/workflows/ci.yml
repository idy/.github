name: Verify pinned repositories

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Test snapshot validation
        run: node --test tests/*.test.mjs
      - name: Compare snapshot with GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/sync-pins.mjs --check
